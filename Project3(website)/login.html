<!DOCTYPE html>
<html>

<head>
<title>Student Login - GCET Jammu</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
<h2>GCET Jammu</h2>

<div>
<a href="index.html">Home</a>
<a href="login.html">Student Login</a>
</div>
</nav>

<section class="login-page">

<div class="login-box">

<h1>Student Login</h1>

<p>Login to access your student portal</p>

<form action="portal.html" method="get">

<label>Roll Number / Email</label>
<input type="text" placeholder="Enter Roll Number or Email" required>

<label>Password</label>
<input type="password" placeholder="Enter Password" required>

<div class="remember">
<input type="checkbox">
<label>Remember Me</label>
</div>

<input type="submit" value="Login" class="login-button">

</form>

<p class="forgot">Forgot Password?</p>

</div>

</section>

<footer>
<p>GCET Jammu | Student Portal</p>
</footer>

</body>

</html>
